[build]
  # Directory with the build files
  base = "frontend"
  
  # Directory that contains the deploy-ready HTML files and assets (relative to base)
  publish = "build"
  
  # Build command
  command = "CI=false npm run build"
  
[build.environment]
  # Prevent warnings from being treated as errors
  CI = "false"
  GENERATE_SOURCEMAP = "false"
  # Specify Node.js version for compatibility
  NODE_VERSION = "18"

# Redirect all requests to index.html for React Router to handle
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
